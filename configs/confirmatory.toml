# Confirmatory run (milestones M6-M8). Values were filled from
# `afterimage calibrate` on the pilot (results/pilot/calibration.json) and
# frozen together with prereg/preregistration.md. That commit's hash is
# recorded in meta.prereg_commit; `afterimage data seal` derives the sealed
# test sets from it.
#
# The [data] section and data_seed must stay identical to pilot.toml so both
# phases train on the same pool.

[meta]
name = "confirmatory"
phase = "confirmatory"
master_seed = 20270101
data_seed = 20261118
prereg_commit = "94c23f717ca724a6afedaa3c2f01eb49184f6ff2"

[data]
pool_size = 4_000_000
heldout_x = [["I", 1, "X"], ["A", 2, "X"], ["X", 1, "O"]]
heldout_nonx = [["I", 2, "A"], ["O", 1, "I"], ["A", 1, "N"]]
heldout_reserve = [["O", 2, "X"], ["X", 2, "I"], ["N", 1, "O"], ["I", 1, "N"]]
# Pilot gate run 1 (2026-11-19): with 1 held-out triple per example, held-out
# accuracy sat at the ceiling (97-99%). Examples with >= 3 were 91-98%.
ood_min_heldout = 3

[model]
layers = 4
d_model = 128
heads = 4
d_ff = 512

[optim]
lr = 5e-4
warmup = 1000
batch = 256

[design]
n_blocks = 16      # resource-limited; the pilot power analysis asked for 68 (see prereg §5)
T0 = 50_000
K = 2_000
H = 20_000
horizons = [0, 1250, 2500, 5000, 10000, 20000]
R = 300
arms = ["C", "I", "N", "S"]
hybrids = true

[analysis]
eps_id_nll = 0.000347913      # pilot calibration
eps_id_aff_nll = 0.000800566  # pilot calibration
eps_id_acc = 0.002            # floor (pilot N-vs-C spread was smaller)
delta_G = 0.00401223          # pilot calibration

[gate]
# Pilot gate run 2 (2026-11-19): seeds that learned the familiar task best also
# generalized best (held-out 0.97-0.98), so a 0.97 cap rejected the best-trained
# seeds (1 of 4 passed). 0.99 still rejects a true ceiling.
ood_acc_high = 0.99

[runtime]
device = "cuda"
