[project]
name = "afterimage"
version = "1.0.0"
description = "A counterfactual laboratory for training-history dependence in neural networks"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "statsmodels>=0.14.2",
  "pyarrow>=16",
  "safetensors>=0.4.3",
]

[project.optional-dependencies]
# Exactly one torch build must be chosen: `uv sync --extra cpu` or `--extra cu130`.
# Both pin the same torch release so CPU and GPU runs share one code path.
cpu = ["torch==2.14.1"]
cu130 = ["torch==2.14.1", "nvidia-ml-py>=12.535"]

[project.scripts]
afterimage = "afterimage.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afterimage"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: exhaustive or end-to-end checks (run with -m slow)",
  "gpu: requires CUDA",
]
addopts = "-m 'not slow and not gpu'"
